<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costa Rica</title>
  </head>
  <body>
    <form action="https://www.dummyjson.com/test" method="POST">
      <h1>Elections</h1>
      <p>Fill up the form</p>
      <br />

      <label for="full_name">Full name</label>
      <br />
      <input type="text" id="full_name" name="name" required />
      <br />

      <label for="user_email">Email</label>
      <br />
      <input type="email" id="user_email" name="email" required />
      <br />

      <label for="user_id">ID</label>
      <br />
      <input type="text" id="user_id" name="id" required />
      <br />

      <label for="user_phone">Phone number</label>
      <br />
      <input type="tel" id="user_phone" name="phone" required />
      <br />

      <br />
      <input
        type="radio"
        id="candidate1"
        name="candidate"
        value="Candidato #1"
        required
      />
      <label for="candidate1">Candidato #1</label>
      <br />

      <input
        type="radio"
        id="candidate2"
        name="candidate"
        value="Candidato #2"
      />
      <label for="candidate2">Candidato #2</label>
      <br />

      <input
        type="radio"
        id="candidate3"
        name="candidate"
        value="Candidato #3"
      />
      <label for="candidate3">Candidato #3</label>
      <br />

      <br />
      <button type="submit">Confirm</button>
      <br />
    </form>

    <br />
    <img
      src="https://images.pexels.com/photos/39402244/pexels-photo-39402244.jpeg"
      alt="Costa rica flag"
      width="300"
    />
  </body>
</html>
