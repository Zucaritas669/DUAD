<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costa Rica</title>
  </head>
  <body>
    <form action="https://www.dummyjson.com/test" method="POST">
      <h1>Elections</h1>
      <p>Fill up the form</p>
      <br />

      <label for="full_name">Full name</label>
      <br />
      <input type="text" id="full_name" name="name" required />
      <br />

      <label for="user_email">Email</label>
      <br />
      <input type="email" id="user_email" name="email" required />
      <br />

      <label for="user_id">ID</label>
      <br />
      <input type="text" id="user_id" name="id" required />
      <br />

      <label for="user_phone">Phone number</label>
      <br />
      <input type="tel" id="user_phone" name="phone" required />
      <br />

      <br />
      <select name="candidate" id="candidate">
        <option hidden>Select one</option>
        <option value="Candidate 1">Candidate #1</option>
        <option value="Candidate 2">Candidate #2</option>
        <option value="Candidate 3">Candidate #3</option>
      </select>
      <br />

      <br />
      <button type="submit">Confirm</button>
      <br />
    </form>

    <br />
    <img
      src="https://images.pexels.com/photos/39402244/pexels-photo-39402244.jpeg"
      alt="Costa rica flag"
      width="300"
    />
  </body>
</html>
