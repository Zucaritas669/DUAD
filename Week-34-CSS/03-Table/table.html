<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <title>Billboard Hot 100</title>
  </head>
  <body>
    <div class="general-container">
      <div class="titles">
        <h1>Billboard Hot 100<sup>&trade;</sup></h1>
        <div class="line"></div>
        <h2 class="date">WEEK OF FEBRUARY 10, 2024</h2>
      </div>
      <table>
        <thead>
          <tr class="header">
            <th>THIS WEEK</th>
            <th></th>
            <th></th>
            <th></th>
            <th>AWARD</th>
            <th>LAST WEEK</th>
            <th>PEAK POS</th>
            <th>WKS ON CHART</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="rank">1</td>
            <td>
              <img
                class="img"
                src="https://upload.wikimedia.org/wikipedia/en/4/4b/Megan_Thee_Stallion_-_Hiss.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled"
                alt="Hiss"
              />
            </td>
            <td class="title-artist">
              <span class="title">Hiss</span>
              <span class="artist">Megan Thee Stallion</span>
            </td>
            <td class="movement">+</td>
            <td class="award">★</td>
            <td class="lastweek">-</td>
            <td class="peak">1</td>
            <td class="weeks">1</td>
          </tr>
          <tr>
            <td class="rank">2</td>
            <td>
              <img
                class="img"
                src="https://i.scdn.co/image/ab67616d0000b2733a5390aae0708eefa335b4bf"
                alt="Lovin on me"
              />
            </td>
            <td class="title-artist">
              <span class="title">Lovin On Me</span>
              <span class="artist">Jack Harlow</span>
            </td>
            <td class="movement">+</td>
            <td class="award"></td>
            <td class="lastweek">1</td>
            <td class="peak">1</td>
            <td class="weeks">12</td>
          </tr>
          <tr>
            <td class="rank">3</td>
            <td>
              <img
                class="img"
                src="https://upload.wikimedia.org/wikipedia/en/f/f8/Taylor_Swift_-_Cruel_Summer.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
                alt="Cruel summer"
              />
            </td>
            <td class="title-artist">
              <span class="title">Cruel Summer</span>
              <span class="artist">Taylor Swift</span>
            </td>
            <td class="movement">+</td>
            <td class="award"></td>
            <td class="lastweek">2</td>
            <td class="peak">1</td>
            <td class="weeks">39</td>
          </tr>
          <tr>
            <td class="rank">4</td>
            <td>
              <img
                class="img"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcts9XQMv5wB1fM9faDMkzuzlezXzqoBsvkNBCSXaOXdSgRc5FGx1Fuak&s=10"
                alt="Lose Control"
              />
            </td>
            <td class="title-artist">
              <span class="title">Lose Control</span>
              <span class="artist">Teddy Swims</span>
            </td>
            <td class="movement">+</td>
            <td class="award">★</td>
            <td class="lastweek">4</td>
            <td class="peak">4</td>
            <td class="weeks">25</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
